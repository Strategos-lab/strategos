name: Build and Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Record bundle size
        run: |
          echo "## Bundle size" >> "$GITHUB_STEP_SUMMARY"
          du -sh apps/web/dist | tee -a "$GITHUB_STEP_SUMMARY"
          find apps/web/dist -type f \( -name '*.js' -o -name '*.css' \) -printf '%s %p\n' | sort -n | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install Playwright browsers
        run: pnpm --filter @strategos/web exec playwright install --with-deps chromium webkit

      - name: E2E smoke
        run: pnpm test:e2e
        env:
          CI: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
