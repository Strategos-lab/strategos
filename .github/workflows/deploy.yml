name: Build and Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build engine
        run: pnpm build:engine

      - name: Typecheck
        run: pnpm typecheck

      - name: Engine tests + coverage (thresholds enforced; failure blocks deploy)
        run: pnpm test:engine:coverage

      - name: Engine coverage summary
        if: always()
        run: |
          test -f packages/engine/coverage/coverage-summary.json || exit 0
          {
            echo "## Engine coverage"
            echo ""
            echo '```'
            node -e "const s=require('./packages/engine/coverage/coverage-summary.json').total; for (const k of ['lines','statements','functions','branches']) console.log(k.padEnd(11), s[k].pct + '%', '(' + s[k].covered + '/' + s[k].total + ')')"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Engine bundle size (budget 40 KB gzipped)
        run: pnpm size:engine | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Web unit tests
        run: pnpm --filter @strategos/web test

      - name: Build
        run: pnpm build

      - name: Record bundle size
        run: |
          {
            echo "## Bundle size"
            echo ""
            echo '```'
            du -sh apps/web/dist
            find apps/web/dist -type f \( -name '*.js' -o -name '*.css' \) -printf '%s %p\n' | sort -n
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Playwright browsers
        run: pnpm --filter @strategos/web exec playwright install --with-deps chromium webkit

      - name: E2E smoke
        run: pnpm test:e2e
        env:
          CI: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
